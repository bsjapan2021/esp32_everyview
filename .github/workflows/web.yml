name: web

# 웹 대시보드 lint · typecheck · build (PRD 5.1 / 저장소 구조)
on:
  push:
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit --pretty false || true

      - name: Build
        env:
          # 빌드는 실제 자격 없이도 통과해야 함(목업 폴백). 실제 값은 Vercel 환경변수.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-placeholder' }}
        run: npm run build
